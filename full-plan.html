<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخطة الكاملة - الكلية التقنية بصامطة</title>
<style>
  :root{
    --green:#0b6b3a; --green-l:#e8f5ee; --ink:#1f2b36;
    --muted:#5b6b7a; --line:#dbe4ea; --bg:#f2f6f8;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:24px 16px 64px;
    font-family:"Segoe UI","Tahoma",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.9;
  }
  .wrap{max-width:1100px;margin:auto}
  header.hero{
    background:linear-gradient(135deg,#0b6b3a,#128a4c);
    color:#fff;border-radius:16px;padding:28px;text-align:center;
    box-shadow:0 10px 24px rgba(11,107,58,.22);
  }
  header.hero h1{margin:0 0 6px;font-size:26px}
  header.hero p{margin:0;opacity:.92;font-size:15px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
  .chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
        padding:5px 14px;border-radius:999px;font-size:13px}

  section{background:#fff;border-radius:14px;padding:22px;margin-top:22px;
          border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.04)}
  h2{font-size:20px;margin:0 0 18px;padding-right:14px;border-right:5px solid var(--green)}

  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;
        display:flex;flex-direction:column}
  .card img{width:100%;height:190px;object-fit:cover;display:block;cursor:zoom-in;background:#eef3f6}
  .card .body{padding:14px 16px 18px}
  .card h3{margin:0 0 8px;font-size:17px;color:var(--green)}
  .row{font-size:14.5px;margin:3px 0;color:var(--muted)}
  .row b{color:var(--ink);font-weight:600}
  .badge{display:inline-block;background:var(--green-l);color:var(--green);
         border-radius:8px;padding:2px 10px;font-size:13px;font-weight:700;margin-bottom:8px}

  .facts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .fact{background:#f8fbfc;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .fact .k{font-size:12.5px;color:var(--muted);margin-bottom:2px}
  .fact .v{font-size:15px;font-weight:600}

  .block{margin-top:18px;padding:16px;border-radius:10px;background:var(--green-l);
         border-right:5px solid var(--green)}
  .block h4{margin:0 0 8px;font-size:15.5px;color:var(--green)}
  .block p{margin:0;white-space:pre-wrap;font-size:15px}
  ul.reco{margin:0;padding-right:20px}
  ul.reco li{margin-bottom:6px}

  .gal{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  figure{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  figure img{width:100%;height:200px;object-fit:cover;display:block;cursor:zoom-in}
  figcaption{padding:10px 14px;font-size:14px;font-weight:600;text-align:center;background:#f8fbfc}

  #lightbox{position:fixed;inset:0;background:rgba(10,20,15,.9);display:none;
            align-items:center;justify-content:center;padding:20px;z-index:99;cursor:zoom-out}
  #lightbox img{max-width:100%;max-height:100%;border-radius:10px}

  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:28px}
  .err{background:#fdecec;border:1px solid #f5b5b5;color:#a12b2b;padding:16px;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>📋 تقرير خطة الطوارئ والإخلاء</h1>
    <p id="subtitle">الكلية التقنية بصامطة</p>
    <div class="chips" id="chips"></div>
  </header>
  <div id="app"></div>
  <footer>تم إنشاء هذه الصفحة من ملف تصدير خطة الطوارئ.</footer>
</div>

<div id="lightbox"><img alt=""></div>

<script src="Data.js"></script>

<script>
(function () {
  const app = document.getElementById('app');
  const data = window.emergencyData;

  if (!data) {
    app.innerHTML = '<section><div class="err">تعذّر تحميل البيانات. تأكد من وجود ملف <b>Data.js</b> في نفس مجلد هذه الصفحة.</div></section>';
    return;
  }

  const esc = v => String(v ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const val = v => (v === undefined || v === null || v === '') ? '—' : esc(v);

  const d = data.drillDetails || {};
  document.getElementById('subtitle').textContent =
    [data.city, d.drillType].filter(Boolean).join(' — ') || 'خطة الطوارئ';

  const chips = [
    d.date && '📅 ' + d.date,
    d.startTime && '⏱ البدء: ' + d.startTime,
    d.endTime && '🏁 الانتهاء: ' + d.endTime,
    d.duration && '⌛ ' + d.duration,
    data.buildingCount && '🏢 ' + data.buildingCount + ' مبنى'
  ].filter(Boolean);
  document.getElementById('chips').innerHTML =
    chips.map(c => '<span class="chip">' + esc(c) + '</span>').join('');

  let html = '';

  const points = Array.isArray(data.assemblyPoints) ? data.assemblyPoints : [];
  if (points.length) {
    html += '<section><h2>🚩 نقاط التجمع (' + points.length + ')</h2><div class="grid">';
    points.forEach(p => {
      html += '<article class="card">'
        + (p.imageUrl ? '<img src="' + p.imageUrl + '" alt="' + esc(p.name) + '" loading="lazy">' : '')
        + '<div class="body">'
        +   '<h3>' + val(p.name) + '</h3>'
        +   '<div class="badge">السعة: ' + val(p.capacity) + '</div>'
        +   '<div class="row"><b>الموقع:</b> ' + val(p.location) + '</div>'
        +   '<div class="row"><b>الوصف:</b> ' + val(p.description) + '</div>'
        + '</div></article>';
    });
    html += '</div></section>';
  }

  const facts = [
    ['التاريخ', d.date],
    ['نوع الفرضية', d.drillType],
    ['وقت البدء', d.startTime],
    ['وقت الانتهاء', d.endTime],
    ['المدة الإجمالية', d.duration],
    ['عدد المشاركين', d.participantsCount],
    ['المشرف', d.supervisor],
    ['الطقس', d.weather],
    ['الموقع', d.location],
    ['الخسائر البشرية', d.humanLosses],
    ['الخسائر المادية', d.materialLosses],
    ['الخسائر التشغيلية', d.operationalLosses]
  ].filter(f => f[1]);

  if (facts.length) {
    html += '<section><h2>📝 تفاصيل الفرضية</h2><div class="facts">';
    facts.forEach(f => {
      html += '<div class="fact"><div class="k">' + esc(f[0]) + '</div>'
            + '<div class="v">' + val(f[1]) + '</div></div>';
    });
    html += '</div>';

    if (d.observations) {
      html += '<div class="block"><h4>الملاحظات</h4><p>' + esc(d.observations) + '</p></div>';
    }
    if (d.recommendations) {
      const items = String(d.recommendations).split('\n')
        .map(t => t.replace(/^\s*\d+\s*[\t.\-]\s*/, '').trim())
        .filter(Boolean);
      html += '<div class="block"><h4>التوصيات</h4><ul class="reco">'
            + items.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul></div>';
    }
    html += '</section>';
  }

  const maps = Array.isArray(data.facilityMaps) ? data.facilityMaps : [];
  if (maps.length) {
    html += '<section><h2>🗺️ مخططات الإخلاء (' + maps.length + ')</h2><div class="gal">';
    maps.forEach(m => {
      html += '<figure>'
        + (m.imageUrl ? '<img src="' + m.imageUrl + '" alt="' + esc(m.title) + '" loading="lazy">' : '')
        + '<figcaption>' + val(m.title) + '</figcaption></figure>';
    });
    html += '</div></section>';
  }

  app.innerHTML = html || '<section>لا توجد بيانات للعرض.</section>';

  const lb = document.getElementById('lightbox');
  const lbImg = lb.querySelector('img');
  document.addEventListener('click', e => {
    if (e.target.matches('img[loading="lazy"], .card img, figure img')) {
      lbImg.src = e.target.src;
      lb.style.display = 'flex';
    } else if (e.target === lb || e.target === lbImg) {
      lb.style.display = 'none';
      lbImg.src = '';
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { lb.style.display = 'none'; lbImg.src = ''; }
  });
})();
</script>
</body>
</html>
